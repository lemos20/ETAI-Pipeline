data:
  path: "data/adult_train.csv"
  target: "income_over_50k"
  sensitive_attr: "race" # Choose between "race" or "sex"
  drop_columns: ["id","education","fnlwgt","income_over_50k"]

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"
  n_jobs: 1  

diagnostics:
  id_column: "id"
  candidate_predictors: ["sex", "race"]
  numeric_text_columns: ["v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09", "v10", "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18"]
  placeholder_tokens: ["?"]
  validity_rules:
    age: {min: 18, max: 90}
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0, max: 99999}
    capital_loss: {min: 0, max: 99999}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"

preprocessing:
  encoder: "target"
  scaler: "standard"
  numeric_features: ["age", "education_num", "capital_gain", "capital_loss", "hours_per_week", "v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09", "v10", "v11", "v12", "v13", "v14", "v15", "v16", "v17", "v18"]
  categorical_features: ["sex", "workclass", "marital_status", "occupation", "relationship", "native_country", "v19", "v20", "v21", "v22", "v23", "v24", "v25"]
  mnar_indicator_sources: ["capital_gain"]
  imputation:
    numeric_strategy: "median"        # applies to age, education_num, capital_gain, capital_loss, hours_per_week, v01-v18
    categorical_strategy: "most_frequent"   # applies to sex, race, workclass, marital_status, occupation, relationship, native_country, v19-v25

model:
  type: "xgboost"   # "logistic_regression" or "decision_tree" or "random_forest" or "dummy" or "oblique_random_forest" or "adaboost" or "gradient_boosting" or "hist_gradient_boosting" or "naive_bayes" or "xgboost"
  params: {}
    #max_iter: 2000

tuning:
  enabled: true
  n_trials: 50
  n_splits: 3
  n_jobs: 1
  random_state: 42
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    hist_gradient_boosting:
      model__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 1e-12, high: 1e-6, log: true}
    xgboost:
      model__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}

output:
  results_dir: "results/adult_pred/runs"   # each run's full report is saved here as a timestamped .txt file
  scoreboard: "results/adult_pred/runs.csv"

feature_selection:
  enabled: true
  min_votes: 2
  random_state: 42
  search_space:
    select_min_votes: {type: int, low: 1, high: 3}

testing:
  enabled: true
  path: "data/adult_new.csv"
  predictions_output: "results/adult_pred/test_predictions.csv"